# Deploy-only: no build job (Web App builds on server via SCM_DO_BUILD_DURING_DEPLOYMENT)
name: Build and deploy Python app to Azure Web App - teams-genie-bot

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: teams-genie-bot
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_856C8D6D6185468EAC82DB3D645B9BD9 }}
          # App lives in DatabricksGenieBOT-main/ (src, requirements.txt)
          package: DatabricksGenieBOT-main
