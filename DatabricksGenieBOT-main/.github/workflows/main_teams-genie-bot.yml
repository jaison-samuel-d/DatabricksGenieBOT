# Deploy-only workflow (no build job - Web App builds on deploy)
name: Build and deploy Python app to Azure Web App - teams-genie-bot

on:
  push:
    branches:
      - main

# Cancel in-progress runs when a new push happens (avoids 15+ min waits from queued runs)
concurrency:
  group: deploy-teams-genie-bot
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: teams-genie-bot
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
